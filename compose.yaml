services:
  db:
    image: postgres:17
    restart: unless-stopped
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: randevu
      POSTGRES_PASSWORD: randevu
      POSTGRES_DB: randevu
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U randevu -d randevu']
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  pgdata:
